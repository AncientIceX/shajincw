name: Build Windows Desktop Pet EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyQt6 and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller pillow

      - name: Build single-file shajincw.exe
        run: |
          pyinstaller --noconsole --onefile --clean --name shajincw --icon=assets/pet_icon.ico --add-data "assets;assets" main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shajincw-windows-exe
          path: dist/shajincw.exe
